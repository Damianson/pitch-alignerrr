services:
  # 1. Backend Flask API (Docker Web Service)
  - type: web
    name: pitch-alignerrr-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # 2. Frontend React + Vite (Static Site - globally distributed via CDN)
  - type: web
    name: pitch-alignerrr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pitch-alignerrr-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
